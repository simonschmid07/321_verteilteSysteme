services:
  grafana-theme:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['python', '-u', 'main.py']
    environment:
      - 'SENSOR_URL=http://localhost:8080/api/light'
      - 'GRAFANA_URL=http://localhost:3000'
      - 'GRAFANA_USER=admin'
      - 'GRAFANA_PASSWORD=admin'
      - 'GRAFANA_SCOPE=user'
    volumes:
      - .:/usr/src/app/
    network_mode: host
    restart: always
