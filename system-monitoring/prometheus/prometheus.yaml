global:
    scrape_interval:     15s # Default is every 1 minute.
    evaluation_interval: 15s # The default is every 1 minute.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
        - targets: ['localhost:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - '172.17.0.1:9100'

  - job_name: 'windows-exporter'
    static_configs:
      - targets:
        - '10.5.61.226:9182'

  - job_name: 'kai-rasperry'
    static_configs:
      - targets:
        - '10.5.61.247:9182'